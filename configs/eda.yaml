# Phase 1 data analysis. Output paths are relative to the repo root (small files, committed).
eda:
  manifest_path: data/manifest.csv
  output_dir: results/eda
  # Stop the job if more than this fraction of the first `check_after` cases cannot be read.
  check_after: 50
  max_error_fraction: 0.05
  # Candidate training crops (x, y, z voxels) for the "does the lesion fit?" analysis.
  crop_sizes:
    - [64, 64, 32]
    - [96, 96, 48]
    - [128, 128, 64]
    - [160, 160, 80]
    - [192, 192, 96]
    - [256, 256, 128]
  # Gallery: one axial slice through the lesion at these lesion-volume quantiles, per dataset.
  gallery_quantiles: [0.05, 0.5, 0.95]
  # Fixed display windows (low, high) in HU, applied after the offset correction (D17).
  gallery_windows:
    default: [-160, 240]                 # soft tissue (width 400, level 40)
    ULS23_Radboudumc_Bone: [-450, 1250]  # bone (width 1700, level 400)
