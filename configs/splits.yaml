# Split decisions (D14, D41). Paths are relative to the repo root (small files, committed).
splits:
  path: splits/uls23_splits.csv
  manifest_path: data/manifest.csv
  # Listing of the course's <dataset>/<train|test>/<images|labels>/ folders (12 Nov 2026), which
  # define the train/test split and the file paths. How to remake it: see scripts/make_splits.py.
  course_listing: splits/course_files.txt
  train_datasets: [ULS23_DeepLesion3D, ULS23_Radboudumc_Bone]
  heldout_datasets: [ULS23_Radboudumc_Pancreas]  # E2 only, never used for any selection
  # Fraction of each training dataset's course training cases moved to validation, by patient.
  val_fraction: 0.15
  # Split seed, separate from the training seed so the splits never change between runs.
  seed: 2311
